<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <title>404 - Không tìm thấy trang</title>
    <style>
      * {
        box-sizing: border-box;
      }

      html,
      body {
        min-height: 100%;
        margin: 0;
      }

      body {
        display: grid;
        min-height: 100vh;
        min-height: 100dvh;
        place-items: center;
        padding: 24px;
        background: #f8fafc;
        color: #0f172a;
        font-family:
          system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        text-align: center;
      }

      main {
        max-width: 480px;
      }

      .code {
        margin: 0 0 12px;
        color: #64748b;
        font-size: clamp(64px, 12vw, 112px);
        font-weight: 700;
        letter-spacing: -0.06em;
        line-height: 1;
      }

      h1 {
        margin: 0;
        font-size: clamp(24px, 4vw, 32px);
        line-height: 1.25;
      }

      .description {
        margin: 14px 0 0;
        color: #64748b;
        font-size: 16px;
        line-height: 1.6;
      }
    </style>
  </head>
  <body>
    <main>
      <p class="code">404</p>
      <h1>Không tìm thấy trang</h1>
      <p class="description">Trang bạn yêu cầu không tồn tại hoặc đã được di chuyển.</p>
    </main>
  </body>
</html>
